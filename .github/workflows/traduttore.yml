
name: Auto Traduttore Sito Intero

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'script_traduzione.py'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  translate-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 deepl

      - name: Verifica libreria DeepL
        run: |
          python -m pip show deepl
          python -c "import deepl; print('Percorso:', deepl.__file__); print('DeepLClient disponibile:', hasattr(deepl, 'DeepLClient'))"

      - name: Traduci intero sito
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python script_traduzione.py

      - name: Salva e pubblica le traduzioni
        run: |
          git config --global user.name "GitHub Translator Bot"
          git config --global user.email "bot@github.com"
          git add index.html
          git commit -m "Auto-traduzione automatica [skip ci]" || exit 0
          git push
